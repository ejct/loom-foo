name: Validate loom-foo source preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validation dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2
      - name: Validate generic Skills and private-data boundaries
        run: python scripts/validate_distribution.py
      - name: Verify fail-closed release builder
        run: python -m unittest discover -s tests -v
      - name: Check email intake source package
        run: python skills/loom-foo-email-intake/tests/test_static.py
